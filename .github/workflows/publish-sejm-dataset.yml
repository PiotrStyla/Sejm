name: Publish ontology-complete Sejm dataset release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLISH to authorize a new immutable Hugging Face release
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sejm-huggingface-dataset
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_DATASET_REPO: PiotrSty/sejm-speeches-corpus
      RELEASE_VERSION: 1.0.1
      PREVIOUS_RELEASE_VERSION: v1.0.0
      RELEASE_ACTOR: github:${{ github.actor }}
      RELEASE_RUN_ID: github-actions:${{ github.run_id }}:attempt:${{ github.run_attempt }}

    steps:
      - name: Check out the reviewed repository revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"

      - name: Install pinned release dependencies
        run: python -m pip install 'huggingface_hub[cli]==0.34.4' 'pyarrow==19.0.1'

      - name: Run ontology and release regression tests
        run: python -m unittest -v tests.test_sejm_release_v2

      - name: Resolve immutable source revision
        id: source
        run: python scripts/resolve_hf_revision.py "$HF_DATASET_REPO" --github-output

      - name: Download source archive at pinned revision
        run: >-
          hf download "$HF_DATASET_REPO" speeches_corpus_all.zip
          --repo-type dataset
          --revision "${{ steps.source.outputs.source_revision }}"
          --local-dir "$RUNNER_TEMP/sejm-source"

      - name: Prepare ontology-complete release
        run: >-
          python scripts/prepare_sejm_release_v2.py
          "$RUNNER_TEMP/sejm-source/speeches_corpus_all.zip"
          --output "$RUNNER_TEMP/sejm-release"
          --release-version "$RELEASE_VERSION"
          --previous-version "$PREVIOUS_RELEASE_VERSION"
          --source-revision "${{ steps.source.outputs.source_revision }}"
          --actor "$RELEASE_ACTOR"
          --run-id "$RELEASE_RUN_ID"
          --git-commit "$GITHUB_SHA"
          --workflow-ref "$GITHUB_WORKFLOW_REF"
          --min-words 50
          --max-year 2027

      - name: Include reviewed dataset card
        run: >-
          install -m 0644 docs/huggingface_dataset_card.md
          "$RUNNER_TEMP/sejm-release/README.md"

      - name: Include documented statutory reuse terms
        run: >-
          install -m 0644 docs/huggingface_dataset_license.md
          "$RUNNER_TEMP/sejm-release/LICENSE"

      - name: Publish release payload and append-only manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload "$HF_DATASET_REPO" "$RUNNER_TEMP/sejm-release" .
          --repo-type dataset
          --include 'README.md' 'LICENSE' 'data/*.parquet' 'metadata/releases/**'
          --commit-message "Release Sejm Corpus $RELEASE_VERSION with Slayer ontology manifest"

      - name: Read immutable version id
        id: manifest
        run: >-
          python -c "import json,os,pathlib;
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'sejm-release'/'metadata'/'releases'/os.environ['RELEASE_VERSION']/'release-manifest.json';
          v=json.loads(p.read_text(encoding='utf-8'))['version']['id'];
          f=open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8');f.write('version_id='+v+'\n');f.close()"

      - name: Verify both Dataset Viewer splits
        run: >-
          python scripts/verify_hf_release.py "$HF_DATASET_REPO"
          --release-version "$RELEASE_VERSION"
          --version-id "${{ steps.manifest.outputs.version_id }}"
          --run-id "$RELEASE_RUN_ID"
          --actor "$RELEASE_ACTOR"
          --output "$RUNNER_TEMP/sejm-release/metadata/releases/$RELEASE_VERSION/publication-attestation.json"

      - name: Append publication attestation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload "$HF_DATASET_REPO"
          "$RUNNER_TEMP/sejm-release/metadata/releases/$RELEASE_VERSION/publication-attestation.json"
          "metadata/releases/$RELEASE_VERSION/publication-attestation.json"
          --repo-type dataset
          --commit-message "Attest Dataset Viewer for Sejm Corpus $RELEASE_VERSION"

      - name: Create immutable release tag
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/tag_hf_release.py "$HF_DATASET_REPO" "v$RELEASE_VERSION"
